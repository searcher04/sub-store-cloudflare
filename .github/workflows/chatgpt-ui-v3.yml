name: Build Sub-Store UI V3
on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/sub-store-ui-v3

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - name: Restore V3 patch bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s ui-v3-payload-base64.txt
          base64 --decode ui-v3-payload-base64.txt > /tmp/substore-ui-v3-patch.tar.xz
          echo "de7b8e85b90c8b22b57615bd7a2d97a896800d4658acfc9ea296a6b405c9d0fd  /tmp/substore-ui-v3-patch.tar.xz" | sha256sum --check
          mkdir -p /tmp/substore-ui-v3
          tar -xJf /tmp/substore-ui-v3-patch.tar.xz -C /tmp/substore-ui-v3
          python3 /tmp/substore-ui-v3/apply_patch.py --repo .
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/views/NodeWorkspace.vue')
          s = p.read_text('utf-8')
          changes = {
            "source.enabled === false": "(source as any).enabled === false",
            "const raw = result.data?.data?.url;": "const raw = 'data' in result.data ? (result.data.data as any)?.url : undefined;",
          }
          for original, updated in changes.items():
            assert s.count(original) == 1, f"Expected exactly one patch target: {original}"
            s = s.replace(original, updated)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check and build frontend
        run: pnpm run check:frontend
      - name: Check worker
        run: pnpm run check:worker
      - name: Wrangler dry-run only
        run: pnpm run deploy:dry-run
      - name: Upload compiled frontend
        uses: actions/upload-artifact@v4
        with:
          name: substore-ui-v3-dist
          path: frontend/dist
          if-no-files-found: error
