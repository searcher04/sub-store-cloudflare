name: Build Sub-Store UI V3
on:
  workflow_dispatch:
  push:
    branches: [chatgpt/sub-store-ui-v3]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'
      - name: Apply V3 patch
        shell: bash
        run: |
          test -s ui-v3-bundle.zip || { echo "::error::Upload ui-v3-bundle.zip into this branch first."; exit 1; }
          unzip -q ui-v3-bundle.zip -d /tmp/substore-v3
          python3 /tmp/substore-v3/sub-store-cloudflare-complete-ui-v3/apply_patch.py --repo .
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate and build frontend
        run: pnpm run check:frontend
      - name: Deploy dry run
        run: pnpm run deploy:dry-run
      - name: Upload built frontend
        uses: actions/upload-artifact@v4
        with:
          name: substore-ui-v3-dist
          path: frontend/dist
          if-no-files-found: error
